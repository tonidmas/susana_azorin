# Mantiene activo el proyecto de Supabase (plan gratuito) para que no se pause por inactividad.
name: Supabase keepalive

on:
  schedule:
    - cron: '0 8 * * 1'   # lunes 08:00 UTC
    - cron: '0 8 * * 4'   # jueves 08:00 UTC
  workflow_dispatch:       # permite lanzarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta sencilla a la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/rental_app_state?select=*&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $code"
          # 200 = respuesta correcta (aunque venga vacía por las reglas RLS)
          if [ "$code" != "200" ]; then
            echo "Respuesta inesperada:"; cat /tmp/resp.txt; exit 1
          fi
